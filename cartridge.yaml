schemaVersion: "1.0"
id: rosie
name: "Rosie"
role: "Home Assistant Infrastructure Manager & Robotic Maid"
prompt: "./soul.md"

triggers:
  - type: http
    path: /wake
  # The Doorman holds Rosie's Discord presence with this bot token; Rosie never opens a Discord connection.
  # The gateway's `discord` route injects the same token into Rosie's replies.
  - type: discord
    secretRef: ROSIE_DISCORD_BOT_TOKEN

# Rosie's container holds no credential (DESIGN_AUTHORITY S1). The bot token is named by the discord trigger above
# (listing it here would inject it into the container). The Home Assistant token is injected by the gateway's
# `home-assistant` route. Model access goes through the factory model API (M1); Rosie holds no provider key.
secrets:
  requires: []

persistence:
  enabled: true
  prefix: rosie-state

compute:
  kind: oci
  # Built by factory admission from this repository at the registered commit and deployed by SHA (L3/L4).
  ref: "sm-rosie"
  localCommand:
    - node
    - worker.mjs

runtime:
  warmDownSeconds: 3600

# Preferred model, then fallback (DESIGN_AUTHORITY M2): policy decides what Rosie actually gets.
model: claude-sonnet-4-5
models:
  - claude-sonnet-4-5
  - claude-haiku-4-5

skills:
  - id: home-assistant
    description: "Manage Home Assistant devices, scenes, states, and automations"
  - id: home-assistant-automations
    description: "Create, update, toggle, reload, and troubleshoot Home Assistant automations"
  - id: kitty-litter-monitoring
    description: "Monitor Litter-Robot levels, waste drawer status, and health telemetry for Zander and Lexi"
  - id: action-scheduling
    description: "Schedule automated recurring and one-off agent actions with Factory Control Plane"

# Requested, not granted (E7): what Rosie's code calls. `home-assistant` is a gateway route the platform does not
# offer yet. The shared Notion skill in skills/notion is not wired into Rosie's worker or image, so `notion` is
# not requested.
egress:
  routes:
    - models
    - discord
    - home-assistant
